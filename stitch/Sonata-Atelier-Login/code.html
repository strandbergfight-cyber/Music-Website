<html class="light" lang="zh-CN"><head>

<style>
        body {
            background-color: #fdfcfb;
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .serif-text {
            font-family: 'Noto Serif', serif;
        }
        .ambient-glow {
            box-shadow: 0 32px 64px -12px rgba(26, 28, 28, 0.04);
        }
        .piano-button-transition {
            transition: all 400ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ledger-input {
            border: none;
            border-bottom: 1px solid rgba(197, 198, 204, 0.3);
            background: transparent;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .ledger-input:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: #4E342E;
        }
        .login-gradient {
            background: linear-gradient(135deg, #4E342E 0%, #361F1a 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top Navigation Anchor (Manual suppression of global nav as per Transactional rule) -->
<header class="w-full px-8 py-12 md:px-20 md:py-16 flex justify-center items-center">
<div class="flex flex-col items-center space-y-2">
<div class="w-12 h-12 mb-4 flex items-center justify-center bg-[#4E342E] rounded-full text-[#efebe9]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">piano</span>
</div>
<h1 class="serif-text text-3xl md:text-4xl font-semibold tracking-tighter text-[#4E342E]">Sonata Atelier</h1>
<p class="font-body text-xs tracking-[0.2em] text-[#919bad] uppercase">The Resonant Conservatory</p>
</div>
</header>
<main class="flex-grow w-full max-w-md px-6 flex flex-col justify-center pb-24">
<!-- Login Card -->
<div class="bg-white rounded-xl ambient-glow p-8 md:p-12 space-y-10 relative overflow-hidden">
<!-- Asymmetric decorative element mimicking a musical score edge -->
<div class="absolute top-0 right-0 w-32 h-32 opacity-[0.03] pointer-events-none translate-x-12 -translate-y-12">
<span class="material-symbols-outlined text-9xl">music_note</span>
</div>
<!-- Segment Control -->
<div class="flex p-1 bg-surface-container rounded-full">
<button class="flex-1 py-3 text-sm font-semibold rounded-full piano-button-transition bg-white text-[#4E342E] shadow-sm">
                    学生登录
                </button>
<button class="flex-1 py-3 text-sm font-medium rounded-full piano-button-transition text-[#919bad] hover:text-[#4E342E]">
                    教师登录
                </button>
</div>
<!-- Form Fields -->
<div class="space-y-8">
<div class="group relative">
<label class="block text-[10px] tracking-widest text-[#919bad] uppercase font-bold mb-1">Phone Number</label>
<div class="flex items-center">
<span class="material-symbols-outlined text-[#919bad] mr-3 text-sm">phone_iphone</span>
<input class="w-full py-4 ledger-input text-[#1b1b1d] placeholder:text-outline-variant/50" placeholder="请输入手机号" type="tel"/>
</div>
</div>
<div class="group relative">
<label class="block text-[10px] tracking-widest text-[#919bad] uppercase font-bold mb-1">Password</label>
<div class="flex items-center">
<span class="material-symbols-outlined text-[#919bad] mr-3 text-sm">lock</span>
<input class="w-full py-4 ledger-input text-[#1b1b1d] placeholder:text-outline-variant/50" placeholder="请输入密码" type="password"/>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="space-y-6 pt-4">
<button class="w-full py-5 login-gradient text-white rounded-lg font-semibold tracking-wide piano-button-transition hover:opacity-95 shadow-lg shadow-[#4E342E]/10 flex items-center justify-center space-x-2">
<span class="serif-text">登录</span>
</button>
<div class="flex justify-center">
<a class="text-xs font-medium text-[#4E342E] hover:opacity-70 piano-button-transition border-b border-transparent hover:border-[#4E342E]" href="#">
                        忘记密码?
                    </a>
</div>
</div>
</div>
<!-- Footer Meta -->
<footer class="mt-12 text-center">
<p class="text-xs text-[#919bad] leading-relaxed">
                还没有账号？<a class="text-[#4E342E] font-semibold underline underline-offset-4" href="#">联系学院管理员注册</a>
</p>
</footer>
</main>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -bottom-24 -left-24 w-96 h-96 opacity-[0.02] rotate-12">
<img class="w-full h-full object-cover rounded-full grayscale" data-alt="close-up of classical piano keys with shallow depth of field and soft morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAh5izHI5Dfq73RxQuPzDAaBBX1ADeIyYgL_tgmLC1cp6MN-9bX4lT2m9O4qS8beOCkkiHIULNGuDxtkSk3f3xEvpORkwDWkuln2my2lDiAovZbP-Osz1TsaJdNToE5VcVtiTwdRa0CbUZoBOo915JYHrbK_1kivh1G1Xm-MUK-e9MkHqkx1WuYkEn_7apuhwrauevvceMavgvI6qbLOvWIUbDGTYXVnif9ArSDb9JFWpBVnyzLYM2S8nFd-_af2Rf8OO7x-gfLaDij"/>
</div>
<div class="absolute top-1/4 -right-12 w-64 h-64 opacity-[0.02] -rotate-6">
<img class="w-full h-full object-cover rounded-full grayscale" data-alt="blurred silhouette of a musician playing cello in a sun-drenched wood-paneled room" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDwWFiDLi2dLgBmkluGu9WxGF58Q_LN2t3NSUuwo5CcD2C2c02P2JfwswIuEabTFIs0jyb5gKxckPn2TCkQB-OmIThgYqS6EYMAe9qrc1JY5vCWSdNo3kE-1CMi9njNTI6YsqJ0B6s7OU7TTsBn-7ULxTzSkj7yCwJWk8j8h20qv81XsKRWL9tcX41sTB8XARSHWjewuQ-zIM2LlFabPCLmPxtoyTg4JttOgl1lAqPCkx7832NZcUnrwkD-_caDw8ZS313MMhv1_rT"/>
</div>
</div>
</body></html>
